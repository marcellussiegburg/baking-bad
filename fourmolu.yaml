# For more information see: https://fourmolu.github.io/config/
---
indentation: 2
column-limit: 100
function-arrows: leading
comma-style: leading
record-style: aligned
import-export-style: diff-friendly
import-grouping: by-scope-then-qualified
indent-wheres: true
record-brace-space: true
newlines-between-decls: 1
haddock-style: multi-line-compact
haddock-style-module: multi-line-compact
haddock-location-signature: auto
let-style: newline
in-style: left-align
if-style: indented
single-constraint-parens: never
single-deriving-parens: never
sort-constraints: true
sort-derived-classes: true
sort-deriving-clauses: true
trailing-section-operators: false
unicode: never
respectful: true
fixities:
  # byobu/StatusLine.hs
  - infixr 0 ?, :?
  - infixr 2 .||.
  - infixr 3 .&&.
